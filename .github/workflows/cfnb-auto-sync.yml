name: CFNB Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: cfnb-auto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Detect Cloudflare DNS settings
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_DNS_RECORD_NAME: ${{ secrets.CF_DNS_RECORD_NAME }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ZONE_ID" ] && [ -n "$CF_DNS_RECORD_NAME" ]; then
            echo "CF_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "CF_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Run CFNB
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_DNS_RECORD_NAME: ${{ secrets.CF_DNS_RECORD_NAME }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          ENABLE_WXPUSHER: ${{ vars.ENABLE_WXPUSHER }}
          GITHUB_SYNC_MAX_RETRIES: "0"
        run: python main.py

      - name: Commit ip.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ip.txt
          if git diff --cached --quiet; then
            echo "ip.txt unchanged"
          else
            git commit -m "Update ip.txt on $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
